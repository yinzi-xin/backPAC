[project]
name = "backPAC"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yinzi-xin", email = "yxin1025@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax",
    "matplotlib",
    "numpy",
    "optax",
    "scipy",
    "zodiax",
    "dlux",
    "tqdm>=4.70.0",
    "cmocean>=4.0.3",
]

[tool.uv.sources]
zodiax = { git = "https://github.com/LouisDesdoigts/zodiax.git", tag = "v0.5.0" }
dlux = { git = "https://github.com/LouisDesdoigts/dLux.git", tag="v0.15.1" }

[project.scripts]
backpac = "backpac:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "pre-commit",
    "ruff",
]

alice = [
    "jax[cuda12]",
    "jupyter>=1.1.1",
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = Isort (replaces your separate isort config)
select = ["E", "F", "I"]
ignore = [
    "E402", # Allow imports not at the top of the file
    "E731", # Allow lambda assignments
    "E741", # Allow ambiguous variable names (l, O, I)
    "E501", # Allow longer comments
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2