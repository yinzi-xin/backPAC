[project]
name = "backPAC"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yinzi-xin", email = "yxin1025@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax",
    "matplotlib",
    "numpy",
    "optax",
    "scipy",
    "zodiax",
    "dlux",
    "tqdm>=4.70.0",
    "cmocean>=4.0.3",
]

[tool.uv.sources]
zodiax = { git = "https://github.com/LouisDesdoigts/zodiax.git", tag = "v0.5.0" }
dlux = { git = "https://github.com/LouisDesdoigts/dLux.git", tag="v0.15.1" }

[project.scripts]
backPAC = "backPAC:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

alice = [
    "jax[cuda12]",
    "jupyter>=1.1.1"
]